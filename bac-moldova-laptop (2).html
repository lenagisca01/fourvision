<html lang="ro"><head><meta charset="utf-8">

<title>BAC Moldova - Profesor AI</title>
<style>
:root{--bg:#f2f7ff;--card:#fff;--ink:#0e2247;--mut:#5a6e94;--pri:#1d62e8;--pri2:#0a3ca8;--soft:#e3eeff;--line:#d3e1f8;--ok:#0d9a68;--bad:#d4414d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#081326;--card:#0f2040;--ink:#e6efff;--mut:#8fa6cf;--pri:#4a8bff;--pri2:#9cc0ff;--soft:#163059;--line:#1d3868}}
:root[data-theme="dark"]{--bg:#081326;--card:#0f2040;--ink:#e6efff;--mut:#8fa6cf;--pri:#4a8bff;--pri2:#9cc0ff;--soft:#163059;--line:#1d3868}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{height:100%;display:flex;flex-direction:column;max-width:860px;margin:auto}
#main{flex:1;overflow-y:auto;padding:18px 16px}
nav{display:flex;border-top:1px solid var(--line);background:var(--card)}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:9px 2px;font:600 11px system-ui;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav button.on{color:var(--pri)}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1{font-size:25px;margin:0 0 4px}h2{font-size:18px;margin:20px 0 10px}.mut{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:left;color:var(--ink);cursor:pointer;font:600 15px system-ui;display:flex;flex-direction:column;gap:10px}
.tile .ic{width:34px;height:34px;padding:7px;border-radius:11px;background:var(--soft);color:var(--pri)}
.btn{background:var(--pri);color:#fff;border:1px solid var(--pri);border-radius:12px;padding:10px 16px;font:600 15px system-ui;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.btn.s{background:var(--soft);color:var(--pri2);border-color:var(--line);padding:8px 12px;font-size:14px}.btn:disabled{opacity:.5}
input,select,textarea{width:100%;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
.ask{display:flex;gap:8px;margin:12px 0}.acts{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.acts select{width:auto}
.m{padding:11px 14px;border-radius:16px;margin:8px 0;max-width:92%;overflow-wrap:anywhere}
.m.u{background:var(--pri);color:#fff;margin-left:auto;border-bottom-right-radius:4px}
.m.a{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.m code{background:var(--soft);padding:1px 5px;border-radius:5px}
iframe{width:100%;height:340px;border:1px solid var(--line);border-radius:12px;background:#fff;margin:8px 0}
.gen,.typing{color:var(--mut);font-style:italic}
#chatbox{display:flex;flex-direction:column;min-height:100%}#chatbox>*{flex:none}#chatbox>#msgs{flex:1 0 auto;min-height:42vh;padding:6px 0 18px}
#chatbox .chip{font-size:14.5px;padding:9px 15px;margin:4px 6px 4px 0;line-height:1.35}
#chatbox>h1{margin-bottom:10px}
.subj{margin:4px 0 10px}
.hint{font-size:14px;line-height:1.6;margin:8px 0 14px}
.tp{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:6px 0 14px}
.tp>summary{cursor:pointer;padding:13px 16px;font-weight:600;font-size:15px;list-style:none;display:flex;justify-content:space-between;gap:10px}
.tp>summary::-webkit-details-marker{display:none}
.tp>summary::after{content:'▾';color:var(--mut);transition:transform .2s}.tp[open]>summary::after{transform:rotate(180deg)}
.tp .tl{max-height:min(38vh,300px);overflow-y:auto;padding:2px 14px 12px}
.dock{position:sticky;bottom:0;background:var(--bg);padding:10px 0 4px;border-top:1px solid var(--line);z-index:2}
.dock .ask{margin:8px 0 4px}.dock textarea{font-size:16px;padding:14px;min-height:50px}
#chatbox .m{font-size:17px;line-height:1.7;padding:15px 20px;margin:14px 0;max-width:100%}
#chatbox .m.u{max-width:88%}
#chatbox .m.a{border-radius:18px;border-bottom-left-radius:5px}
#chatbox .acts .btn.s{padding:10px 14px;font-size:14.5px}
.wl{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:12px 4px 28px}
.wl .grade{width:132px;height:132px;position:relative;margin:0 0 18px}
.wl .grade b{position:absolute;inset:0;display:grid;place-items:center;font:700 74px/1 Georgia,'Times New Roman',serif;color:#d4414d;transform:rotate(-6deg)}
.wl .grade svg{position:absolute;inset:0;width:100%;height:100%;fill:none;stroke:#d4414d;stroke-width:3;stroke-linecap:round}
.wl h1{font:700 44px/1.08 Georgia,'Times New Roman',serif;margin:0 0 10px;letter-spacing:-.5px}
.wl .lead{font-size:18px;line-height:1.6;color:var(--mut);max-width:30em;margin:0 0 22px}
.wl .subs{margin:0 0 26px}.wl .subs span{display:inline-block;background:var(--soft);color:var(--pri2);border-radius:20px;padding:8px 15px;margin:4px 6px 4px 0;font-weight:600;font-size:15px}
.wl ul{list-style:none;padding:0;margin:0 0 28px;display:grid;gap:12px;max-width:34em}
.wl li{display:flex;gap:14px;align-items:flex-start;font-size:16px;line-height:1.5}
.wl li .ic{width:38px;height:38px;padding:8px;border-radius:12px;background:var(--soft);color:var(--pri)}
.wl li b{display:block}.wl li span{color:var(--mut);font-size:14.5px}
.wl .go{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.wl .btn{font-size:17px;padding:14px 26px;border-radius:14px}
.wl small{display:block;margin-top:22px;color:var(--mut);font-size:13px}
@media (max-width:480px){.wl h1{font-size:36px}}
@media (prefers-reduced-motion:no-preference){.wl .grade svg path{stroke-dasharray:420;stroke-dashoffset:420;animation:dr 1.1s .25s ease-out forwards}}
@keyframes dr{to{stroke-dashoffset:0}}
.bar{height:10px;background:var(--soft);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri);border-radius:6px}
.row{display:flex;justify-content:space-between;gap:10px;margin:12px 0 5px;font-weight:600}
.chip{display:inline-block;background:var(--soft);color:var(--pri2);border:0;border-radius:20px;padding:6px 12px;margin:3px 4px 3px 0;font:600 13px system-ui;cursor:pointer}
.chip.on{background:var(--pri);color:#fff}
.fb{border-left:3px solid var(--pri);padding-left:10px;margin:6px 0;color:var(--mut)}.rec{background:var(--bad)!important;color:#fff!important}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;font:inherit;cursor:pointer}.opt.ok{border-color:var(--ok)}.opt.bad{border-color:var(--bad)}@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.vp{opacity:0;animation:vin .6s forwards;background:var(--soft);color:var(--pri2);border-radius:12px;padding:10px 14px;margin:8px 0;font-weight:600}.pl{white-space:pre-wrap}#pr{display:none}@media print{#app{display:none!important}#pr{display:block;color:#000;background:#fff;font:14px/1.5 Georgia,serif}#pr h1{font-size:22px}#pr h2{font-size:17px;margin:16px 0 6px}}
.big{font-size:42px;font-weight:800;color:var(--pri)}
.lock{opacity:.55}.plan.on{border-color:var(--pri);border-width:2px}
</style></head><body>

async function doLogin(){const a=ACC.list.find(x=>x.n===LG.who);if((await sha($('#lp').value))!==a.pin){alert('PIN incorect');return}enter(a.n)}
async function doReg(){const n=$('#rn').value.trim(),p=$('#rp').value;if(!n||p.length<4){alert('Introdu numele și un PIN de minim 4 cifre.');return}if(ACC.list.some(x=>x.n.toLowerCase()===n.toLowerCase())){alert('Acest nume există deja.');return}ACC.list.push({n,pin:await sha(p),k:'bac_'+Date.now()});enter(n)}
function enter(n){ACC.cur=n;saveA();LG={};loadU();resetMem();render()}
function logout(){save();ACC.cur=null;saveA();resetMem();WELCOME=true;render()}
function choosePlan(id){if(id==='free'||S.abo===id){S.abo=id;save();render();return}PLN=id;view='pay';render()}
V.pay=function(){const p=PAY[PLN],nm=PLN==='plus'?'Elev Plus':'Familie';return `<h1>Plata abonamentului</h1><div class="card"><b>${nm}</b> · ${p.price}<ol class="mut"><li>Apasă „Plătește" și achită în pagina procesatorului de plăți.</li><li>Primești un cod de activare.</li><li>Introdu codul mai jos.</li></ol>${p.url?`<a class="btn" href="${esc(p.url)}" target="_blank" rel="noopener">Plătește ${p.price}</a>`:'<div class="mut">Linkul de plată nu este configurat încă.</div>'}</div><div class="card"><b>Cod de activare</b><div class="ask"><input id="ac" placeholder="Cod"><button class="btn" onclick="activate()">Activează</button></div></div><button class="btn s" onclick="go('cont')">Înapoi</button>`};
function activate(){const c=($('#ac').value||'').trim().toUpperCase();if(CODES[c]===PLN){S.abo=PLN;save();alert('Abonament activat.');go('cont')}else alert('Cod invalid.')}
let PM='card',PB=false,PE='',PF={},PR=null;
const luhn=n=>{let t=0,d=false;for(let i=n.length-1;i>=0;i--){let x=+n[i];if(d){x*=2;if(x>9)x-=9}t+=x;d=!d}return t%10===0};
function cancelSub(){S.abo='free';S.exp=null;save();render()}
V.pay=function(){const p=PAY[PLN],nm=PLN==='plus'?'Elev Plus':'Familie';
 if(PB===1)return `<h1>Plata</h1><div class="card typing">Se procesează plata (simulare)...</div>`;
 if(PB==='ok')return `<h1>Plata reușită</h1><div class="card"><div class="big" style="color:var(--ok)">OK</div><b>${nm}</b> · ${esc(p.price)}<div class="mut">Chitanță: ${esc(PR.ref)}</div><div class="mut">Valabil până la ${new Date(PR.d+30*864e5).toLocaleDateString('ro-RO')}</div><div class="mut" style="font-size:13px">Plată simulată; nu s-au retras bani.</div></div><button class="btn" onclick="PB=false;PF={};go('cont')">Continuă</button>`;
 const cd=PM==='card';
 return `<h1>Plata abonamentului</h1><div class="card" style="border-color:var(--pri)"><b>MOD SIMULATOR</b><div class="mut">Nu se retrag bani reali. Card de test reușit: 4242 4242 4242 4242. Card refuzat: 4000 0000 0000 0002. Orice dată viitoare și orice CVC din 3 cifre.</div></div><div class="card"><b>${nm}</b> · ${esc(p.price)}</div><div>${[['card','Card'],['paynet','Paynet']].map(m=>`<button class="chip ${PM===m[0]?'on':''}" onclick="PM='${m[0]}';PE='';render()">${m[1]}</button>`).join('')}</div>
<div class="card">${cd?`<label>Număr card<input id="cn" inputmode="numeric" maxlength="19" placeholder="4242 4242 4242 4242" value="${esc(PF.n||'')}" oninput="this.value=this.value.replace(/\\D/g,'').slice(0,16).replace(/(.{4})/g,'$1 ').trim()"></label><br><br><div class="ask" style="margin:0"><label style="flex:1">Expirare<input id="ce" maxlength="5" placeholder="MM/YY" value="${esc(PF.e||'')}" oninput="this.value=this.value.replace(/[^\\d/]/g,'').replace(/^(\\d\\d)(\\d)/,'$1/$2').slice(0,5)"></label><label style="flex:1">CVC<input id="cc" type="password" inputmode="numeric" maxlength="3" value="${esc(PF.c||'')}"></label></div><br><label>Nume pe card<input id="ch" value="${esc(PF.h||'')}"></label>`:`<div class="mut">Vei confirma plata prin Paynet (simulat), fără date de card.</div>`}${PE?`<p style="color:var(--bad)">${esc(PE)}</p>`:''}<p><button class="btn" onclick="payNow()">Plătește ${esc(p.price)}</button></p></div><button class="btn s" onclick="PE='';PF={};go('cont')">Înapoi</button>`};
async function payNow(){if(PB)return;
 if(PM==='card'){const g=i=>($('#'+i).value||'').trim();const n=g('cn').replace(/\s/g,''),e=g('ce'),c=g('cc'),h=g('ch'),m=e.match(/^(\d\d)\/(\d\d)$/);let err='';
  if(!/^\d{13,19}$/.test(n)||!luhn(n))err='Număr de card invalid.';
  else if(!m||+m[1]<1||+m[1]>12||new Date(2000+ +m[2],+m[1],1)<=new Date())err='Data de expirare este invalidă sau a trecut.';
  else if(!/^\d{3}$/.test(c))err='CVC invalid (3 cifre).';
  else if(h.length<3)err='Introdu numele de pe card.';
  else if(n==='4000000000000002')err='Card refuzat de bancă (simulare).';
  if(err){PE=err;PF={n:g('cn'),e,h};render();return}}
 PE='';PB=1;render();await new Promise(r=>setTimeout(r,1800));
 const d=Date.now(),ref='SIM-'+d.toString(36).toUpperCase();
 S.abo=PLN;S.exp=d+30*864e5;S.pays=(S.pays||[]).concat([{d,plan:PLN,price:PAY[PLN].price,ref,m:PM}]).slice(-10);save();PR={ref,d};PB='ok';render()}
render();
</script></body></html>
